[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-automation"
version = "1.3.0"
description = "基于 Python + Patchright 的 Outlook 本地自动化框架（浏览器管理 / 账号管理 / 流程引擎 / 任务队列 / 管理面板）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhonggy" }]
keywords = ["outlook", "automation", "patchright", "playwright"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "patchright==1.52.5",
    "PyYAML==6.0.2",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "APScheduler==3.11.0",
    "requests==2.32.3",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
outlook-automation = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "account",
    "api",
    "browser",
    "config",
    "database",
    "flow",
    "logger",
    "proxy",
    "task",
]

[tool.setuptools.package-data]
config = ["config.yaml"]
api = ["static/*.html"]

[tool.setuptools.data-files]
"outlook_automation" = [
    "requirements.txt",
    "scripts/setup_browser.py",
]