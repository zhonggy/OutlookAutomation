name: build-release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖（含测试依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: 运行测试
        run: python -m pytest tests -q

  build-wheel:
    name: 构建 wheel + sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: 构建
        run: python -m build
      - name: 上传 wheel 产物（Actions Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: outlook-automation-dist
          path: dist/
          if-no-files-found: error

  build-exe:
    name: 构建 Windows exe
    needs: [test, build-wheel]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: PyInstaller 打包
        run: python -m PyInstaller outlook.spec --distpath release --workpath build/pyi --noconfirm
      - name: 下载并装入 fingerprint-chromium 内核（148.0.7778.215，与本地一致）
        # 注意：必须在 PyInstaller 之后拷贝（--noconfirm 会清空 release/OutlookAutomation）
        shell: pwsh
        run: |
          $url = "https://github.com/adryfish/fingerprint-chromium/releases/download/148.0.7778.215/ungoogled-chromium_148.0.7778.215-1.1_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile chromium.zip
          Expand-Archive -Path chromium.zip -DestinationPath chromium_extract -Force
          New-Item -ItemType Directory -Force -Path "release/OutlookAutomation/browsers/fingerprint-chromium" | Out-Null
          Get-ChildItem -Path "chromium_extract" -Directory | ForEach-Object {
            Copy-Item -Recurse -Force $_.FullName "release/OutlookAutomation/browsers/fingerprint-chromium/"
          }
          Remove-Item -Recurse -Force chromium.zip, chromium_extract
          Get-ChildItem -Recurse "release/OutlookAutomation/browsers" -Filter chrome.exe | Select-Object FullName
      - name: 复制可编辑配置到 exe 旁边
        run: |
          New-Item -ItemType Directory -Force -Path "release/OutlookAutomation/config" | Out-Null
          Copy-Item -Force "config/config.yaml" "release/OutlookAutomation/config/config.yaml"
      - name: 压缩为 zip
        shell: pwsh
        run: Compress-Archive -Path release/OutlookAutomation -DestinationPath release/OutlookAutomation-windows-x64.zip
      - name: 上传 exe 产物（Actions Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: outlook-automation-exe
          path: release/OutlookAutomation-windows-x64.zip
          if-no-files-found: error
      - name: 下载 wheel 产物（一并发布）
        uses: actions/download-artifact@v4
        with:
          name: outlook-automation-dist
          path: release-extra/
      - name: 发布 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/OutlookAutomation-windows-x64.zip
            release-extra/*.whl
            release-extra/*.tar.gz
          generate_release_notes: true